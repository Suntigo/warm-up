<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 200px;
        }
        div{
            background-color: blue;
        }
        #box1{
            width: 250px;
            height: 500px;
            transition: transform 5s;
        }
        #box1:hover{
            transform-origin: left;
            transform: scaleX(2);
        }

        #box2{
            width: 250px;
            height: 250px;
        }
        #box2{
            width: 150px;
            height: 150px;
        }
        .p{
            display: none;
            transition: transform 5s ;
        }
        #box2:hover{
            transform: scale(2);
        }
        #box2:hover .p{
            display: block;
        }
        /*i want the box to double in size and at the same time make the second paragraph visible*/

    </style>
</head>
<body>
    <div id="box1"></div>

     <div id="box2">
        <p>Hover to see more</p>
        
        <p class="p">This Is The Extra Information</p>
    
    </div>
</body>
</html>
