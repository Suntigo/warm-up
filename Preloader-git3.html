<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
            border-top: 5px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: load infinite 15s linear;
        }

        @keyframes load {
            0%{
                transform: rotate(0deg);
            }

             100%{
                transform: rotate(360deg);
            }

            
        }
        .content{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid white;
            border-bottom: 5px solid transparent;
             animation: load2 infinite 5s linear ;
        }

        @keyframes load2 {
            0%{
                transform: rotate(0deg);
            }

             100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="content"></div>
    </div>
</body>
</html>
