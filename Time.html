<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(46, 143, 228);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            transform-style: preserve-3d;
        }
        div{
            position: absolute;
            width: 300px;
            height: 400px;
            transform: rotateY(35deg);
        }
        .item1{
            background-color:blue;
            left: 200px;
            transform: rotateY(70deg);
            transition: 5s transform;
        }
          .item1:hover{
            transform:  translateZ(200px)  rotateY(0deg);
        }
        .item2{
            background-color: red;
            left: 240px;
            transform: rotateY(70deg);
            transition: 5s transform;
        }
           .item2:hover{
            transform:  translateZ(200px)  rotateY(0deg);
        }
        .item3{
            background-color: chartreuse;
            left: 280px;
            transform: rotateY(70deg);
            transition: 5s transform;
        }
           .item3:hover{
            transform:  translateZ(200px)  rotateY(0deg);
        }
        .item4{
            background-color: yellow;
            left: 320px;
            transform: rotateY(70deg);
            transition: 5s transform;
        }
           .item4:hover{
            transform:  translateZ(200px)  rotateY(0deg);
        }
        .item5{
            background-color: aqua;
            left: 360px;
            transform: rotateY(70deg);
            /* transition: 5s transform; */
            animation: file 5s infinite linear ;
            animation-play-state: paused;
        }
           .item5:hover{
             animation-play-state: running;
        }

        
           @keyframes file{
            0%{
                transform: rotateY(70deg);
            }

            50%{
                transform:  translateZ(200px) rotateY(70deg) ;
            }

            80%{
                   transform:  translateZ(200px) rotateY(0deg) ;
            }

            100%{
                 transform:  translateZ(200px) rotateY(0deg) ;
            }
            
           }
        .item6{
            background-color: cornflowerblue;
            left: 420px;
            transform: rotateY(70deg);
            transition: 5s transform;
          
        }
        .item6:hover{
           transform:  translateZ(200px)  rotateY(0deg);
        }
           /* This is The original file */
           /* This is the branch file */


        .back1,.back2,.back3{position: absolute; width: 200px; height: 200px; border-radius: 50%; transform: rotateY(0deg);}

        .back1{
            background-color: aliceblue;
            top: 170px;
            left: 900px;
        }

        .back2{
            background-color: cornflowerblue;
            top: 170px;
            left: 0px;
        }

        .back3{
            background-color: lightblue;
            top: 170px;
            left: 500px;
            transform: translateZ(-500px);
        }

    </style>
</head>
<body>
    <div class="item1">1</div>
    <div class="item2">2</div>
    <div class="item3">3</div>
    <div class="item4">4</div>
    <div class="item5">5</div>
    <div class="item6">6</div>

    <div class="back1"></div>
    <div class="back2"></div>
    <div class="back3"></div>
    <!--This Is The Official Master File-->
</body>
</html>
