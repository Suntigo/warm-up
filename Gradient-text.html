<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
        
        p{
            background:linear-gradient(to bottom right, blue,red,green,yellow,purple,palevioletred);
            font-size: 64px;
            line-height: 350px;
            background-clip: text;
            color: transparent;
            
        }
        

    </style>
</head>
<body>
        <p>This is A Gradient Text </p>
    

        <!-- 
        this can be acheived using background-clip text on the text , setting the color of the text to
        be transparent, giving the text background a garadient

        questions:
        what is line height
        line-height controls the vertical space occupied by a line of text.
        means each line of text gets a vertical line box of about 350px. in this situation

        It's especially useful when you have multiple lines of text. 

       since i applied it to the p tag the next p tag element will  be 350px from the last one

       what is background-clip;
       It decides how far should an elements background be allowed to paint 
        
        
        -->




    
</body>
</html>
